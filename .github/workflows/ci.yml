name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**', 'claude/**']
    tags: ['v*']
  pull_request:
  # Manual run: publishes the Docker images of the selected ref (tag or branch).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The jobs are the reusable workflows of rocket-core, shared by every brick.
# Reusable workflows of rocket-core, pinned to a version tag (updated by Renovate with the bundle and the layer).
jobs:
  backend:
    name: Backend (PHP)
    uses: fayouz/rocket-core/.github/workflows/brick-backend.yml@v0.2.1

  frontend:
    name: Frontend (Nuxt)
    uses: fayouz/rocket-core/.github/workflows/brick-frontend.yml@v0.2.1

  docs:
    name: Docs (Nuxt Content)
    uses: fayouz/rocket-core/.github/workflows/brick-frontend.yml@v0.2.1
    with:
      working-directory: docs
      build-script: generate

  images:
    name: Docker images
    needs: [backend, frontend]
    # Published to ghcr.io ONLY for version tags v* and manual runs (multi-arch amd64 + arm64, SBOM, provenance);
    # pull requests and branches: amd64 validation build + smoke tests, never pushed.
    permissions:
      contents: read
      packages: write
    # TODO: pin to the next rocket-core tag once fayouz/rocket-core#6 (docker-images.yml) is released.
    uses: fayouz/rocket-core/.github/workflows/docker-images.yml@v0.3.1

  demo:
    name: Demo environment (compose)
    # Lent : lancé seulement à la demande (Actions › CI › Run workflow).
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    uses: fayouz/rocket-core/.github/workflows/brick-demo.yml@v0.2.1
    with:
      front-url: http://localhost:4000
      docs-url: http://localhost:4001
      # Scenarios of this brick: .github/demo-scenarios.sh
