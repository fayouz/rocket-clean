framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        # Rocket\Core\Message\AsyncMessageInterface messages go to "async" (routing set by the RocketCoreBundle).

when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
