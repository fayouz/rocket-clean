security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: Rocket\Core\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: app_user_provider
            user_checker: Rocket\Core\Security\UserChecker
            custom_authenticators:
                - Rocket\Core\Security\LoginAuthenticator
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: Rocket\Core\Security\UserChecker
            entry_point: jwt
            jwt: ~
            custom_authenticators:
                - Rocket\Core\Security\ApplicationTokenAuthenticator
                - Rocket\Core\Security\EmbedTokenAuthenticator

    access_control:
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/(setup|suite)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/embed/frame-policy$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/(providers|oidc/callback|oidc/backchannel-logout)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/theme$, roles: PUBLIC_ACCESS }
        - { path: ^/api/public/cleaning/, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
